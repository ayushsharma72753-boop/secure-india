<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECURE INDIA - Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family: Arial; background: #f4f6f9; padding: 20px; margin:0; }
h1 { color: #222; }
.cards { display: flex; flex-wrap: wrap; gap: 10px; }
.card { background: white; padding: 20px; border-radius: 15px; width: 200px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
.card p { margin:0; color: #666; }
.card h2 { margin: 5px 0; font-size: 36px; }
.total { border-left: 5px solid #007bff; }
.report { border-left: 5px solid #ff9800; }
.fixed { border-left: 5px solid #4caf50; }
.pending { border-left: 5px solid #f44336; }
.box { background: white; padding: 15px; border-radius: 10px; margin-top: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
input { padding: 12px; width: 60%; max-width: 300px; border-radius: 8px; border: 1px solid #ccc; }
.btn-add { background: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
table { width: 100%; background: white; border-radius: 10px; margin-top: 15px; border-collapse: collapse; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
th { background: #222; color: white; }
th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
.btn-fix { background: #4caf50; color: white; padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; }
.btn-pending { background: #ff9800; color: white; padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; margin-left: 5px;}
.badge { padding: 3px 8px; border-radius: 10px; font-size: 12px; color: white; }
.badge-admin { background: #007bff; }
.badge-user { background: #666; }
</style>
</head>
<body>

<h1>SECURE INDIA - Admin Panel</h1>

<div class="cards">
  <div class="card total"><p>Total Users</p><h2 id="totalUsers">0</h2></div>
  <div class="card report"><p>Total Reports</p><h2 id="totalReports">0</h2></div>
  <div class="card fixed"><p>Fixed</p><h2 id="fixed">0</h2></div>
  <div class="card pending"><p>Pending</p><h2 id="pending">0</h2></div>
</div>

<div class="box">
  <h3>Admin - Apni Report Karo</h3>
  <input id="newTitle" placeholder="Ex: Road damage near Kishanganj station" />
  <button class="btn-add" onclick="addAdminReport()">+ Report Add</button>
  <p style="font-size:12px; color:#888;">Ye report 'admin' ke naam se jayegi. User apni report apne app se karega.</p>
</div>

<div class="box">
  <h3>Saari Reports (User + Admin) - Admin sabko Fix kar sakta hai</h3>
  <table id="reportTable">
    <tr><th>Title</th><th>Reported By</th><th>Status</th><th>Action</th></tr>
  </table>
</div>

<script>
const SUPABASE_URL = "https://enpcocqbdbkxlhbfcaxb.supabase.co"
const SUPABASE_KEY = "sb_publishable_8sDL_P60NTrjbCTzJHLbvQ_q5cltzsY"
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

async function loadDashboard() {
  const { count: usersCount } = await supabaseClient.from('users').select('*', { count: 'exact', head: true })
  document.getElementById("totalUsers").innerText = usersCount || 0

  const { count: reportsCount } = await supabaseClient.from('reports').select('*', { count: 'exact', head: true })
  document.getElementById("totalReports").innerText = reportsCount || 0

  const { count: fixedCount } = await supabaseClient.from('reports').select('*', { count: 'exact', head: true }).eq('status', 'fixed')
  document.getElementById("fixed").innerText = fixedCount || 0

  const { count: pendingCount } = await supabaseClient.from('reports').select('*', { count: 'exact', head: true }).eq('status', 'pending')
  document.getElementById("pending").innerText = pendingCount || 0

  const { data: reports, error } = await supabaseClient.from('reports').select('*').order('created_at', {ascending:false})
  if(error){ console.log(error); return; }

  let table = document.getElementById("reportTable")
  table.innerHTML = "<tr><th>Title</th><th>Reported By</th><th>Status</th><th>Action</th></tr>"
  
  reports.forEach(r => {
    let badge = r.reported_by === 'admin' ? '<span class="badge badge-admin">ADMIN</span>' : '<span class="badge badge-user">USER</span>'
    table.innerHTML += `<tr>
      <td>${r.title}</td>
      <td>${badge} ${r.reported_by}</td>
      <td><b>${r.status.toUpperCase()}</b></td>
      <td>
        <button class="btn-fix" onclick="updateStatus('${r.id}','fixed')">Fixed Karo</button>
        <button class="btn-pending" onclick="updateStatus('${r.id}','pending')">Pending Karo</button>
      </td>
    </tr>`
  })
}

async function addAdminReport(){
  let title = document.getElementById("newTitle").value.trim()
  if(!title) return alert("Pehle title likho!")
  const { error } = await supabaseClient.from('reports').insert([{ title: title, status: 'pending', reported_by: 'admin' }])
  if(error){ alert(error.message) } else {
    document.getElementById("newTitle").value = ""
    loadDashboard()
  }
}

async function updateStatus(id, status){
  await supabaseClient.from('reports').update({ status: status }).eq('id', id)
  loadDashboard()
}

loadDashboard()
// Auto refresh har 3 sec
setInterval(loadDashboard, 3000)
</script>

</body>
</html>

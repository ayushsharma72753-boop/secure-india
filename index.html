<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECURE INDIA - Final</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{font-family:Arial;margin:0;padding:10px;background:#eee}
.box{max-width:550px;margin:auto;background:#fff;padding:15px;border-radius:12px;margin-bottom:10px}
#map,#map2{height:380px;width:100%;border:2px solid orange;border-radius:10px}
input,select,textarea,button{width:100%;padding:11px;margin-top:8px;border-radius:7px;border:1px solid #ccc;box-sizing:border-box}
button{background:#ff6600;color:#fff;font-weight:bold;border:none;cursor:pointer;padding:12px}
.card{padding:10px;background:#fff8f0;border-left:5px solid orange;border-radius:8px;margin-top:10px;white-space:pre-wrap;font-size:13px}
.hidden{display:none}
img{width:100%;border-radius:8px;margin-top:6px}
.thank{background:linear-gradient(135deg,#ff6600,#ff8c42);color:#fff;padding:20px;border-radius:12px;text-align:center;margin-top:15px}
.thankInner{background:#fff;color:#333;padding:12px;border-radius:8px;text-align:left;font-size:13px;margin-top:12px}
</style>
</head>
<body>

<div class="box" id="loginPanel">
<h2 style="text-align:center">SECURE INDIA 🇮🇳</h2>
<p style="text-align:center;font-size:12px">GPS + Camera + Vibhag wise Report</p>
<input type="email" id="loginEmail" placeholder="Email daalo - ayushsharma72753@gmail.com admin hai">
<button onclick="simpleLogin()">Login Karo</button>
</div>

<div class="box hidden" id="userPanel">
<div style="display:flex;justify-content:space-between;align-items:center"><b id="userEmailShow" style="font-size:11px"></b><button onclick="logout()" style="width:auto;background:#d32f2f;padding:6px 10px">Logout</button></div>
<div id="map"></div>
<p id="gpsCity" style="text-align:center;font-weight:bold;color:green;font-size:12px">📍 GPS se city nikal rahe hain...</p>
<input id="city" placeholder="City GPS se auto ayega"><input id="pincode" placeholder="Pincode *"><input id="location" placeholder="GPS auto" readonly>
<select id="category"><option value="pothole">🕳️ Pothole -> PWD</option><option value="garbage">🗑️ Garbage -> Nagar Nigam</option><option value="electricity">⚡ Electricity -> Bijli Vibhag</option><option value="water">💧 Water -> Jal Vibhag</option></select>

<label style="font-weight:bold;margin-top:10px;display:block;font-size:13px">📸 Photo (Koi bhi daal sakta hai - Camera/Gallery)</label>
<input type="file" id="photoInput" accept="image/*" capture="environment">
<img id="preview" class="hidden" style="height:200px;object-fit:cover;border:2px dashed orange">

<textarea id="desc" placeholder="Apni problem detail me likho *"></textarea>
<button onclick="submitData()" id="submitBtn">📤 Vibhag ko Bhejo (TO + CC ke saath)</button>

<div id="thankYouBox" class="thank hidden">
<h3>🙏 Thank You!</h3>
<div class="thankInner">
<p id="t1"></p>
<p id="t2"></p>
<p id="t3"></p>
<p id="t4"></p>
<p id="t5" style="font-weight:bold;text-align:center;margin-top:12px">Thank You for using Secure India ❤️ Jai Hind!</p>
</div>
</div>

<hr><h3>📋 Meri Reports (Map pe dikhega)</h3><div id="myReportList"></div>
</div>

<div class="box hidden" id="adminPanel">
<h2>ADMIN DASHBOARD 👑</h2><p id="adminEmailShow" style="font-size:11px"></p>
<div id="map2"></div>
<h3>All Reports - TO + CC + Reporter + Problem + Thank You format me</h3>
<div id="list"></div>
<button onclick="logout()" style="background:#d32f2f;margin-top:10px">Logout</button>
</div>

<script>
const ADMIN_EMAIL="ayushsharma72753@gmail.com";
const STATE_DEPT={
"Bihar":{pothole:"biharpwd@nic.in",garbage:"lsd-bihar@nic.in",electricity:"bsphcl@nic.in",water:"phed-bihar@nic.in"},
"Uttar Pradesh":{pothole:"uppwd@nic.in",garbage:"urbandept-up@nic.in",electricity:"uppcl@nic.in",water:"jalnigam-up@nic.in"},
"Delhi":{pothole:"mcd-it@nic.in",garbage:"mcd-it@nic.in",electricity:"bses@nic.in",water:"djb@nic.in"},
"Maharashtra":{pothole:"pwd-maha@nic.in",garbage:"swm-maha@nic.in",electricity:"mahadiscom@nic.in",water:"water-maha@nic.in"},
"default":{pothole:"cpgramsdarpg@nic.in",garbage:"cpgramsdarpg@nic.in",electricity:"cpgramsdarpg@nic.in",water:"cpgramsdarpg@nic.in"}
};
const supa=window.supabase.createClient("https://enpcocqbdbkxlhbfcaxb.supabase.co","sb_publishable_8sDL_P60NTrjbCTzJHLbvQ_q5cltzsY");
let myLat=26.44,myLon=80.33,currentUserEmail=null,detectedState="default",uploadedFile=null;
let map=L.map('map').setView([myLat,myLon],11); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let map2=L.map('map2').setView([myLat,myLon],11); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map2);

document.getElementById("photoInput").addEventListener("change",e=>{
  uploadedFile=e.target.files[0];
  if(uploadedFile){
    document.getElementById("preview").src=URL.createObjectURL(uploadedFile);
    document.getElementById("preview").classList.remove("hidden");
  }
});

async function simpleLogin(){
  let email=document.getElementById("loginEmail").value.trim().toLowerCase();
  if(!email){alert("Email daalo");return;}
  await supa.from("site_visits").insert({email:email});
  if(email===ADMIN_EMAIL){
    let p=prompt("Admin Password daalo:");
    if(p==="saringaan@143"){localStorage.setItem("userEmail",email);localStorage.setItem("isAdmin","yes");location.reload();}
    else alert("Wrong Password");
  } else {localStorage.setItem("userEmail",email);localStorage.setItem("isAdmin","no");location.reload();}
}
function logout(){localStorage.clear();location.reload();}
function checkLogin(){
  let email=localStorage.getItem("userEmail"); let isAdmin=localStorage.getItem("isAdmin");
  if(!email){document.getElementById("loginPanel").classList.remove("hidden");return;}
  currentUserEmail=email; document.getElementById("userEmailShow").innerText=email; document.getElementById("adminEmailShow").innerText=email;
  if(isAdmin==="yes"&&email===ADMIN_EMAIL){document.getElementById("adminPanel").classList.remove("hidden"); setTimeout(()=>{map2.invalidateSize();loadAdmin();},600);}
  else {document.getElementById("userPanel").classList.remove("hidden"); setTimeout(()=>{map.invalidateSize();startGPS();loadMap();loadMyReports();},600);}
}
checkLogin();

function startGPS(){
  navigator.geolocation.getCurrentPosition(async pos=>{
    myLat=pos.coords.latitude; myLon=pos.coords.longitude;
    document.getElementById("location").value=myLat+","+myLon;
    map.setView([myLat,myLon],16);
    L.marker([myLat,myLon]).addTo(map).bindPopup("📍 Tum Yahan Ho").openPopup();
    try{
      let r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${myLat}&lon=${myLon}`);
      let d=await r.json();
      let city=d.address.city||d.address.town||d.address.village||"";
      let state=d.address.state||"default";
      detectedState=state;
      document.getElementById("city").value=city+", "+state;
      document.getElementById("gpsCity").innerText=`📍 Detected: ${city}, ${state} -> Isi ke vibhag ko jayega`;
    }catch(e){document.getElementById("gpsCity").innerText=`📍 GPS: ${myLat.toFixed(4)}, ${myLon.toFixed(4)}`;}
  },()=>{document.getElementById("gpsCity").innerText="⚠️ GPS allow karo tabhi city ke vibhag ko jayega";});
}

async function loadMap(){
  let {data}=await supa.from("reports").select("*").limit(100);
  if(!data) return;
  data.forEach(r=>{
    if(!r.latitude||!r.latitude.includes(",")) return;
    let [lat,lon]=r.latitude.split(",").map(Number); if(isNaN(lat)) return;
    L.marker([lat,lon]).addTo(map).bindPopup(`<b>${r.city}</b><br>${r.category}`);
  });
}

async function submitData(){
  let cityVal=document.getElementById("city").value.trim();
  let pincode=document.getElementById("pincode").value.trim();
  let problem=document.getElementById("desc").value.trim();
  let cat=document.getElementById("category").value;
  if(!cityVal||!pincode||!problem){alert("City, Pincode, Problem bharo");return;}
  let btn=document.getElementById("submitBtn"); btn.innerText="⏳ Bhej rahe hain..."; btn.disabled=true;
  let photoUrl="";
  if(uploadedFile){
    let fileName=Date.now()+"_"+uploadedFile.name.replace(/\s/g,"_");
    let {error}=await supa.storage.from("pothole-photos").upload(fileName, uploadedFile);
    if(!error){let {data}=supa.storage.from("pothole-photos").getPublicUrl(fileName); photoUrl=data.publicUrl;}
  }
  let stateKey=Object.keys(STATE_DEPT).find(s=>cityVal.toLowerCase().includes(s.toLowerCase()))||detectedState;
  if(!STATE_DEPT[stateKey]) stateKey="default";
  let deptEmail=STATE_DEPT[stateKey][cat];
  // FINAL FORMAT TUJHE JO CHAHIYE
  let finalDesc=`TO: ${deptEmail}\nCC: ${currentUserEmail}\nReporter Email: ${currentUserEmail}\nProblem: ${problem}\nCity: ${cityVal} | State: ${stateKey} | GPS: ${myLat},${myLon} | Category: ${cat}\nPhoto: ${photoUrl}\n\nThank You - Secure India`;

  let {error}=await supa.from("reports").insert([{reporter_email:currentUserEmail,city:cityVal,pincode:pincode,category:cat,latitude:document.getElementById("location").value,description:finalDesc,dept_email:deptEmail,status:'pending'}]);
  if(error){alert(error.message); btn.disabled=false; btn.innerText="Vibhag ko Bhejo"; return;}

  document.getElementById("thankYouBox").classList.remove("hidden");
  document.getElementById("t1").innerText=`TO (Jis Vibhag ko): ${deptEmail}`;
  document.getElementById("t2").innerText=`CC: ${currentUserEmail}`;
  document.getElementById("t3").innerText=`Reporter Email: ${currentUserEmail}`;
  document.getElementById("t4").innerText=`Problem: ${problem}`;
  document.getElementById("t5").innerText=`Thank You - Aapki report ${cityVal} ke ${cat} vibhag ko chali gayi! Jai Hind ❤️`;

  btn.disabled=false; btn.innerText="📤 Vibhag ko Bhejo (TO + CC ke saath)";
  document.getElementById("desc").value=""; uploadedFile=null; document.getElementById("preview").classList.add("hidden");
  loadMyReports(); loadMap();
  window.scrollTo(0, document.body.scrollHeight);
}

async function loadMyReports(){
  let {data}=await supa.from("reports").select("*").eq("reporter_email",currentUserEmail).order("created_at",{ascending:false});
  if(!data||data.length==0){document.getElementById("myReportList").innerHTML="Koi report nahi";return;}
  let html=""; data.forEach(r=>{
    let m=r.description.match(/https:\/\/[^\s]+\.(jpg|jpeg|png|webp)/);
    let img=m?`<img src="${m[0]}">`:"";
    html+=`<div class="card"><b>${r.category.toUpperCase()} - ${r.city}</b><br>${r.description}<br>${img}<br>Status: <b>${r.status}</b><br><button onclick="fixIt('${r.id}',1)" style="background:green;width:48%;display:inline-block">Fixed</button> <button onclick="delIt('${r.id}',1)" style="background:#d32f2f;width:48%;display:inline-block">Delete</button></div>`;
  });
  document.getElementById("myReportList").innerHTML=html;
}

async function loadAdmin(){
  let {data}=await supa.from("reports").select("*").order("created_at",{ascending:false});
  let html=""; if(data) data.forEach(r=>{
    let m=r.description.match(/https:\/\/[^\s]+\.(jpg|jpeg|png|webp)/);
    let img=m?`<img src="${m[0]}">`:"";
    html+=`<div class="card"><b>${r.city} - ${r.category}</b> | Reporter: ${r.reporter_email}<br>TO: ${r.dept_email}<br>${r.description}<br>${img}<br><button onclick="fixIt('${r.id}',0)" style="background:green;width:48%">Fixed</button> <button onclick="delIt('${r.id}',0)" style="background:#d32f2f;width:48%">Delete</button></div>`;
    if(r.latitude&&r.latitude.includes(",")){let [lat,lon]=r.latitude.split(",").map(Number); if(!isNaN(lat)) L.marker([lat,lon]).addTo(map2).bindPopup(r.city);}
  });
  document.getElementById("list").innerHTML=html||"No reports";
}
async function fixIt(id,isUser){await supa.from("reports").update({status:'fixed'}).eq("id",id); if(isUser) loadMyReports(); else loadAdmin();}
async function delIt(id,isUser){if(confirm("Delete pakka?")){await supa.from("reports").delete().eq("id",id); if(isUser) loadMyReports(); else loadAdmin();}}
</script>
</body>
  </html>

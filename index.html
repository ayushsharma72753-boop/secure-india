<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECURE INDIA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{font-family:Arial;margin:0;padding:10px;background:#eee}
.box{max-width:550px;margin:auto;background:#fff;padding:15px;border-radius:12px;margin-bottom:10px}
#map,#map2{height:380px;width:100%;border:2px solid #ff6600;border-radius:10px}
input,select,textarea,button{width:100%;padding:11px;margin-top:8px;border-radius:7px;border:1px solid #ccc;box-sizing:border-box}
button{background:#ff6600;color:#fff;font-weight:bold;border:none;cursor:pointer}
.card{padding:10px;background:#fff8f0;border-left:5px solid orange;border-radius:8px;margin-top:10px;white-space:pre-wrap;font-size:13px}
.hidden{display:none}
img{width:100%;border-radius:8px;margin-top:6px}
.thank{background:linear-gradient(135deg,#ff6600,#ff8c42);color:#fff;padding:20px;border-radius:12px;text-align:center;margin-top:15px}
.alert50{background:red;color:#fff;padding:12px;border-radius:8px;text-align:center;font-weight:bold;animation:blink 1s infinite;display:none}
@keyframes blink{0%{opacity:1}50%{opacity:0.5}100%{opacity:1}}
</style>
</head>
<body>

<div class="box" id="loginPanel">
<h2 style="text-align:center">SECURE INDIA 🇮🇳</h2>
<p style="text-align:center;font-size:13px">GPS + Camera + Department Wise Report</p>
<input type="email" id="loginEmail" placeholder="Enter your email">
<button onclick="simpleLogin()">Login</button>
</div>

<div class="box hidden" id="userPanel">
<div style="display:flex;justify-content:space-between"><b id="userEmailShow" style="font-size:11px"></b><button onclick="logout()" style="width:auto;background:#d32f2f;padding:6px 10px">Logout</button></div>

<div id="alert50m" class="alert50">⚠️ ALERT! POTHOLE WITHIN 50 METER - BE CAREFUL!</div>

<div id="map"></div>
<p id="gpsCity" style="text-align:center;font-weight:bold;color:green;font-size:12px">Getting GPS location...</p>
<input id="city" placeholder="City (auto)"><input id="pincode" placeholder="Pincode *"><input id="location" readonly>
<select id="category"><option value="pothole">Pothole -> PWD Department</option><option value="garbage">Garbage -> Municipal Corporation</option><option value="electricity">Electricity -> Electricity Dept</option><option value="water">Water -> Water Dept</option></select>

<label style="font-weight:bold;margin-top:10px;display:block;font-size:13px">Photo (Anyone can upload - Camera/Gallery)</label>
<input type="file" id="photoInput" accept="image/*" capture="environment">
<img id="preview" class="hidden" style="height:200px;object-fit:cover;border:2px dashed orange">

<textarea id="desc" placeholder="Write your problem in detail *"></textarea>
<button onclick="submitData()" id="submitBtn">Send to Department (TO + CC)</button>

<div id="thankYouBox" class="thank hidden">
<h3>Thank You! Report Sent</h3>
<div style="background:#fff;color:#333;padding:12px;border-radius:8px;text-align:left;font-size:13px;margin-top:10px">
<p id="t1"></p><p id="t2"></p><p id="t3"></p><p id="t4"></p>
<p style="font-weight:bold;text-align:center;margin-top:10px">Thank you for using Secure India - Jai Hind! ❤️</p>
</div>
</div>

<hr><h3>My Reports</h3><div id="myReportList"></div>
</div>

<div class="box hidden" id="adminPanel">
<h2>ADMIN DASHBOARD</h2><div id="map2"></div><div id="list"></div><button onclick="logout()" style="background:#d32f2f;margin-top:10px">Logout</button>
</div>

<script>
const ADMIN_EMAIL="ayushsharma72753@gmail.com";
const STATE_DEPT={
"Bihar":{pothole:"biharpwd@nic.in",garbage:"lsd-bihar@nic.in",electricity:"bsphcl@nic.in",water:"phed-bihar@nic.in"},
"Uttar Pradesh":{pothole:"uppwd@nic.in",garbage:"urbandept-up@nic.in",electricity:"uppcl@nic.in",water:"jalnigam-up@nic.in"},
"Delhi":{pothole:"mcd-it@nic.in",garbage:"mcd-it@nic.in",electricity:"bses@nic.in",water:"djb@nic.in"},
"default":{pothole:"cpgramsdarpg@nic.in",garbage:"cpgramsdarpg@nic.in",electricity:"cpgramsdarpg@nic.in",water:"cpgramsdarpg@nic.in"}
};
const supa=window.supabase.createClient("https://enpcocqbdbkxlhbfcaxb.supabase.co","sb_publishable_8sDL_P60NTrjbCTzJHLbvQ_q5cltzsY");
let myLat=26.44,myLon=80.33,currentUserEmail=null,detectedState="default",uploadedFile=null, allReports=[];
let map=L.map('map').setView([myLat,myLon],11); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let map2=L.map('map2').setView([myLat,myLon],11); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map2);

function getDistance(lat1,lon1,lat2,lon2){let R=6371e3; let d1=lat1*Math.PI/180; let d2=lat2*Math.PI/180; let dl=(lat2-lat1)*Math.PI/180; let dn=(lon2-lon1)*Math.PI/180; let a=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(d1)*Math.cos(d2)*Math.sin(dn/2)*Math.sin(dn/2); let c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); return R*c;}

document.getElementById("photoInput").addEventListener("change",e=>{uploadedFile=e.target.files[0]; if(uploadedFile){document.getElementById("preview").src=URL.createObjectURL(uploadedFile); document.getElementById("preview").classList.remove("hidden");}});

async function simpleLogin(){let email=document.getElementById("loginEmail").value.trim().toLowerCase(); if(!email) return alert("Enter email"); await supa.from("site_visits").insert({email}); if(email===ADMIN_EMAIL){let p=prompt("Admin Password:"); if(p==="saringaan@143"){localStorage.setItem("userEmail",email);localStorage.setItem("isAdmin","yes");location.reload();}else alert("Wrong");} else {localStorage.setItem("userEmail",email);localStorage.setItem("isAdmin","no");location.reload();}}
function logout(){localStorage.clear();location.reload();}
function checkLogin(){let email=localStorage.getItem("userEmail"); let isAdmin=localStorage.getItem("isAdmin"); if(!email){document.getElementById("loginPanel").classList.remove("hidden");return;} currentUserEmail=email; document.getElementById("userEmailShow").innerText=email; if(isAdmin==="yes"&&email===ADMIN_EMAIL){document.getElementById("adminPanel").classList.remove("hidden"); setTimeout(()=>{map2.invalidateSize();loadAdmin();},500);} else {document.getElementById("userPanel").classList.remove("hidden"); setTimeout(()=>{map.invalidateSize();startGPS();loadMap();loadMyReports();},500);} }
checkLogin();

function startGPS(){
  navigator.geolocation.watchPosition(async pos=>{
    myLat=pos.coords.latitude; myLon=pos.coords.longitude;
    document.getElementById("location").value=myLat+","+myLon;
    map.setView([myLat,myLon],16);
    // 50m ALERT CHECK
    let near = allReports.filter(r=>{if(!r.latitude||!r.latitude.includes(",")) return false; let [la,lo]=r.latitude.split(",").map(Number); if(isNaN(la)) return false; return getDistance(myLat,myLon,la,lo) <= 50;});
    if(near.length>0){document.getElementById("alert50m").style.display="block"; document.getElementById("alert50m").innerText=`⚠️ ALERT! ${near.length} POTHOLE(S) WITHIN 50 METER - SLOW DOWN!`; if(navigator.vibrate) navigator.vibrate([500,200,500]);} else {document.getElementById("alert50m").style.display="none";}
    try{let r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${myLat}&lon=${myLon}`); let d=await r.json(); let city=d.address.city||d.address.town||""; let state=d.address.state||"default"; detectedState=state; document.getElementById("city").value=city+", "+state; document.getElementById("gpsCity").innerText=`Detected: ${city}, ${state} - Will go to this state dept`;}catch(e){}
  },()=>{}, {enableHighAccuracy:true, maximumAge:0});
}

async function loadMap(){
  let {data}=await supa.from("reports").select("*").limit(200);
  allReports=data||[];
  if(!data) return;
  data.forEach(r=>{if(!r.latitude||!r.latitude.includes(",")) return; let [lat,lon]=r.latitude.split(",").map(Number); if(isNaN(lat)) return; L.marker([lat,lon]).addTo(map).bindPopup(`<b>${r.city}</b><br>${r.category}`);});
}
async function submitData(){
  let cityVal=document.getElementById("city").value.trim(); let pincode=document.getElementById("pincode").value.trim(); let problem=document.getElementById("desc").value.trim(); let cat=document.getElementById("category").value;
  if(!cityVal||!pincode||!problem){alert("Fill all fields");return;}
  let btn=document.getElementById("submitBtn"); btn.innerText="Sending..."; btn.disabled=true;
  let photoUrl=""; if(uploadedFile){let fn=Date.now()+"_"+uploadedFile.name.replace(/\s/g,"_"); let {error}=await supa.storage.from("pothole-photos").upload(fn,uploadedFile); if(!error){let {data}=supa.storage.from("pothole-photos").getPublicUrl(fn); photoUrl=data.publicUrl;}}
  let stateKey=Object.keys(STATE_DEPT).find(s=>cityVal.toLowerCase().includes(s.toLowerCase()))||detectedState; if(!STATE_DEPT[stateKey]) stateKey="default";
  let deptEmail=STATE_DEPT[stateKey][cat];
  let finalDesc=`TO: ${deptEmail}\nCC: ${currentUserEmail}\nReporter Email: ${currentUserEmail}\nProblem: ${problem}\nCity: ${cityVal} | State: ${stateKey} | GPS: ${myLat},${myLon}\nPhoto: ${photoUrl}\n\nThank You - Secure India`;
  await supa.from("reports").insert([{reporter_email:currentUserEmail,city:cityVal,pincode:pincode,category:cat,latitude:document.getElementById("location").value,description:finalDesc,dept_email:deptEmail,status:'pending'}]);
  document.getElementById("thankYouBox").classList.remove("hidden");
  document.getElementById("t1").innerText=`TO (Department): ${deptEmail}`;
  document.getElementById("t2").innerText=`CC: ${currentUserEmail}`;
  document.getElementById("t3").innerText=`Reporter Email: ${currentUserEmail}`;
  document.getElementById("t4").innerText=`Problem: ${problem}`;
  btn.disabled=false; btn.innerText="Send to Department (TO + CC)"; loadMyReports(); loadMap();
}
async function loadMyReports(){let {data}=await supa.from("reports").select("*").eq("reporter_email",currentUserEmail).order("created_at",{ascending:false}); let html=""; if(data) data.forEach(r=>{html+=`<div class="card">${r.description}<br><button onclick="fixIt('${r.id}',1)" style="background:green">Fixed</button> <button onclick="delIt('${r.id}',1)" style="background:red">Delete</button></div>`;}); document.getElementById("myReportList").innerHTML=html;}
async function loadAdmin(){let {data}=await supa.from("reports").select("*").order("created_at",{ascending:false}); let html=""; if(data) data.forEach(r=>{html+=`<div class="card">${r.description}<br><button onclick="fixIt('${r.id}',0)" style="background:green;width:48%">Fixed</button> <button onclick="delIt('${r.id}',0)" style="background:red;width:48%">Delete</button></div>`;}); document.getElementById("list").innerHTML=html;}
async function fixIt(id,u){await supa.from("reports").update({status:'fixed'}).eq("id",id); if(u) loadMyReports(); else loadAdmin();}
async function delIt(id,u){if(confirm("Delete?")){await supa.from("reports").delete().eq("id",id); if(u) loadMyReports(); else loadAdmin();}}
</script></body></html>
